    <hr>
    
    <div class="questionnaire-form">
        <form action="mailto:iasgarov19939@ada.edu.az" method="post" enctype="text/plain">
            <p>Did you like my website?</p>
            <input type="radio" name="Like" value="Yes"> Yes
            <input type="radio" name="Like" value="No"> No
            <br><br>

            <p>Do you want more tutorials?</p>
            <input type="radio" name="Tutorials" value="Yes"> Yes
            <input type="radio" name="Tutorials" value="No"> No
            <br><br>

            <p>Topics you like:</p>
            <input type="checkbox" name="Topics" value="Java"> Java
            <input type="checkbox" name="Topics" value="WebDev"> Web Dev
            <input type="checkbox" name="Topics" value="GameDev"> Game Dev
            <br><br>

            <label for="rating">Rate my site (1–5):</label> 
            <select name="Rating" id="rating">
                <option>1</option><option>2</option><option>3</option>
                <option>4</option><option>5</option>
            </select>
            <br><br>

            <label for="feedback">Feedback:</label>
            <textarea name="Feedback" id="feedback" rows="4" cols="30"></textarea><br><br>

            <input type="submit" value="Send">
            <input type="reset" value="Clear">
        </form>
    </div>

    <footer>
