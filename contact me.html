    <section class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <form action="mailto:iasgarov19939@ada.edu.az" method="post" enctype="text/plain" class="p-4 border bg-light rounded shadow-sm">
                    
                    <div class="mb-3">
                        <label for="name" class="form-label">Name:</label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="subject" class="form-label">Subject:</label>
                        <input type="text" id="subject" name="subject" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="message" class="form-label">Message:</label>
                        <textarea id="message" name="message" rows="5" class="form-control"></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label d-block">Preferred Contact Method:</label>
                        <div class="form-check form-check-inline">
                            <input type="radio" name="contact_method" value="email" class="form-check-input" id="contactEmail" checked>
                            <label class="form-check-label" for="contactEmail">Email</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="radio" name="contact_method" value="phone" class="form-check-input" id="contactPhone">
                            <label class="form-check-label" for="contactPhone">Phone</label>
                        </div>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" name="subscribe" value="yes" class="form-check-input" id="subscribeCheck">
                        <label class="form-check-label" for="subscribeCheck">Subscribe to newsletter</label>
                    </div>

                    <div class="mb-4">
                        <label for="reason" class="form-label">Reason for contact:</label>
                        <select id="reason" name="reason" class="form-select">
                            <option value="question">Question</option>
                            <option value="feedback">Feedback</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <footer>
